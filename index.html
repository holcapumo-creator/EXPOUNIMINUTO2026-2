        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b1329;
            color: #ffffff;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-title img {
            height: 70px;
            object-fit: contain;
        }

        .header-title h1 {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header-info {
            text-align: right;
            color: #a0aec0;
        }

        .header-info .date-range {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
        }

        .header-info .subtext {
            font-size: 0.9rem;
            margin-top: 4px;
        }

        /* Days bar */
        .days-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .day-card {
            border: 1px solid #2d3748;
            border-radius: 6px;
            padding: 12px 18px;
            text-align: center;
            min-width: 90px;
            cursor: pointer;
            transition: all 0.2s;
            background-color: transparent;
            color: #ffffff;
        }

        .day-card:hover {
            border-color: #4a5568;
        }

        .day-card.active {
            background-color: #ffffff;
            color: #0b1329;
            border-color: #ffffff;
        }

        .day-name {
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .day-number {
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1;
            margin: 4px 0;
        }

        .day-events {
            font-size: 0.75rem;
            opacity: 0.8;
        }

        /* Filters */
        .filters-container {
            display: flex;
            gap: 12px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 180px;
        }

        .filter-group label {
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #a0aec0;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .filter-input, .filter-select {
            background-color: transparent;
            border: 1px solid #2d3748;
            border-radius: 4px;
            color: #ffffff;
            padding: 10px 12px;
            font-size: 0.9rem;
            outline: none;
        }

        .filter-select option {
            background-color: #0b1329;
            color: #ffffff;
        }

        .btn-clear {
            background-color: transparent;
            border: 1px solid #2d3748;
            border-radius: 4px;
            color: #ffffff;
            padding: 10px 20px;
            font-size: 0.9rem;
            cursor: pointer;
            align-self: flex-end;
        }

        .btn-clear:hover {
            background-color: #1a202c;
        }

        /* Section Title */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 20px;
            border-bottom: 1px solid #1a202c;
            padding-bottom: 10px;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-counter {
            color: #a0aec0;
            font-size: 0.95rem;
        }

        /* Event Cards */
        .events-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .event-card {
            display: flex;
            background-color: #111a33;
            border: 1px solid #1e2942;
            border-radius: 6px;
            overflow: hidden;
        }

        .time-box {
            width: 150px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            flex-shrink: 0;
            background-color: #1e3a8a;
            color: #ffffff;
        }

        .time-text {
            font-size: 1.2rem;
            font-weight: 800;
        }

        .time-text span {
            font-size: 0.75rem;
            font-weight: normal;
        }

        .event-details {
            padding: 20px 25px;
            flex-grow: 1;
        }

        .tags {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 3px;
            background-color: #2c7a7b;
            color: #e6fffa;
        }

        .tag.location {
            background-color: #2d3748;
            color: #cbd5e0;
        }

        .event-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .event-description {
            color: #a0aec0;
            font-size: 0.95rem;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .event-footer {
            font-size: 0.85rem;
            color: #cbd5e0;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .event-footer strong {
            color: #a0aec0;
            text-transform: uppercase;
        }
    </style>
</head>

        let currentDayFilter = "18-nov";

        function renderEvents() {
            const listContainer = document.getElementById('eventsList');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = eventsData.filter(ev => {
                const matchesDay = currentDayFilter ? ev.day === currentDayFilter : true;
                const matchesSearch = ev.title.toLowerCase().includes(searchVal) || 
                                      ev.desc.toLowerCase().includes(searchVal) || 
                                      ev.school.toLowerCase().includes(searchVal) || 
                                      ev.location.toLowerCase().includes(searchVal);
                return matchesDay && matchesSearch;
            });

            document.getElementById('sectionCounter').innerText = `${filtered.length} eventos encontrados`;

            if(filtered.length === 0) {
                listContainer.innerHTML = `<div style="text-align:center; padding: 40px; color: #a0aec0;">No se encontraron actividades para este filtro.</div>`;
                return;
            }

            let html = '';
            filtered.forEach(ev => {
                html += `
                    <div class="event-card">
                        <div class="time-box">
                            <div class="time-text">${ev.start}</div>
                            <div style="font-size: 0.8rem; margin-top: 4px;">hasta ${ev.end}</div>
                        </div>
                        <div class="event-details">
                            <div class="tags">
                                <span class="tag">${ev.school}</span>
                                <span class="tag location">${ev.location}</span>
                            </div>
                            <h3 class="event-title">${ev.title}</h3>
                            <p class="event-description">${ev.desc}</p>
                            <div class="event-footer">
                                <div><strong>Fecha:</strong> ${ev.dateText}</div>
                                <div><strong>Lugar:</strong> ${ev.location}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        function filterByDay(day) {
            currentDayFilter = day;
            document.querySelectorAll('.day-card').forEach(card => card.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            const dayNames = {
                '12-nov': 'Jueves 12 de noviembre',
                '13-nov': 'Viernes 13 de noviembre',
                '17-nov': 'Martes 17 de noviembre',
                '18-nov': 'Miércoles 18 de noviembre',
                '19-nov': 'Jueves 19 de noviembre',
                '20-nov': 'Viernes 20 de noviembre',
                '21-nov': 'Sábado 21 de noviembre',
                '23-nov': 'Lunes 23 de noviembre',
                '24-nov': 'Martes 24 de noviembre'
            };
            document.getElementById('sectionTitle').innerText = dayNames[day] || 'Actividades';
            renderEvents();
        }

        function resetFilters() {
            currentDayFilter = null;
            document.getElementById('searchInput').value = '';
            document.querySelectorAll('.day-card').forEach(card => card.classList.remove('active'));
            document.getElementById('sectionTitle').innerText = "Todas las Actividades";
            renderEvents();
        }

        // Inicializar al cargar
        renderEvents();
    </script>
</body>
</html>
